experiment:
  tag: "adaptive_fix_curriculum"
  output_root: "reports"
  runs_root: "runs"
  data_root: "data"
  models_root: "models"

simulation:
  n_episodes: 50
  seeds: [1,2,3,4,5]
  max_steps: 300
  policy: "mcts"
  policy_kwargs:
    mcts_sims: 200
    c_puct: 1.25

export:
  enabled: true
  exporter: "ai_ready"
  out_csv: "bc_training_generated.csv"

train:
  mode: "rl"
  device: "auto"
  rl:
    timesteps: 50000
    env_overrides:
      curriculum_closing_prob: 0.4
      curriculum_keys34_prob: 0.3
      curriculum_keys34_min_keys: 3
      curriculum_keys34_max_keys: 4

eval:
  enabled: true
  n_episodes: 40
  max_steps: 300
  policy: "trained"
