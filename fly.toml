# fly.toml - Configuración Fly.io para CARCOSA
app = "carcosa-playtest"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile.fly"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Recursos gratis: 1 shared CPU, 256MB RAM
[vm]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Health check (formato correcto para fly.toml)
[checks]
  [checks.health]
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/"
    method = "GET"